name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local && docker compose up -d --wait db
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm contracts && git diff --exit-code -- docs/api/openapi.json packages/contracts/src/api.d.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm diagrams:setup
      - name: Validate diagrams in Chromium
        run: |
          export ARCHIFY_CHROME="$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          pnpm diagrams:build
      - run: pnpm security:deps && pnpm run sbom
      - run: pnpm security:scan
      - run: docker build -t chira-os:local .
      - run: pnpm security:image
      - run: pnpm security:database
      - run: pnpm backup .local/backups/ci && pnpm restore:check .local/backups/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-evidence
          path: |
            .local/sbom.cdx.json
            .local/diagram-evidence/
            playwright-report/
          retention-days: 7
      - name: Stop local services
        if: always()
        run: docker compose down
