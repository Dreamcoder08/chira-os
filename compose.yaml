name: chira-os
services:
  db:
    image: chira-os-db:local
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: chira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm exec tsx scripts/setup-local.ts}
      # Alpine/musl has no glibc locales. ICU keeps Spanish ordering deterministic and
      # independent of the host libc, instead of silently falling back to C collation.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=es-PE --locale=C.UTF-8'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chira']
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt: ['no-new-privileges:true']
  # Pilot origin: TLS for a phone on the local network, so the PWA gets a secure
  # context and the service worker can register. Only this profile uses it, which
  # keeps the default stack and its image scans unchanged.
  proxy:
    profiles: ['pilot']
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    network_mode: host
    environment:
      PILOT_HOST: ${PILOT_HOST:-chira.local}
      PILOT_PORT: ${PILOT_PORT:-8443}
    volumes:
      - ./docker/pilot/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt: ['no-new-privileges:true']
volumes:
  postgres:
  caddy-data:
  caddy-config:
